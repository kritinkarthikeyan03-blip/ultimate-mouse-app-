name: Build Cross-Platform Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynput pyinstaller

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name="UltimateMouseApp-Windows" universal_mouse_utility.py

      - name: Build Executable (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --noconsole --windowed --name="UltimateMouseApp-macOS" universal_mouse_utility.py

      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --noconsole --name="UltimateMouseApp-Linux" universal_mouse_utility.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseUtility-${{ matrix.os }}
          path: dist/*
